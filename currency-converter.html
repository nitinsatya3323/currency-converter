<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currency Converter</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #2f81f7;
    --accent-hover: #1f6feb;
    --error: #f85149;
    --success: #3fb950;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background: radial-gradient(circle at top, #161b22 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  h1 { font-size: 1.5rem; text-align: center; }
  .subtitle { text-align: center; color: var(--muted); font-size: .85rem; margin: 6px 0 22px; }
  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 6px; }
  input, select {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 1rem;
    outline: none;
    transition: border-color .2s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .field { margin-bottom: 16px; }
  .row { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 18px; }
  .row .field { flex: 1; margin-bottom: 0; }
  #swap {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 44px; height: 44px;
    font-size: 1.2rem;
    cursor: pointer;
    transition: transform .3s, border-color .2s;
    flex-shrink: 0;
  }
  #swap:hover { border-color: var(--accent); transform: rotate(180deg); }
  #convert {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
  }
  #convert:hover { background: var(--accent-hover); }
  #convert:disabled { opacity: .6; cursor: not-allowed; }
  .result {
    margin-top: 20px;
    padding: 18px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    text-align: center;
    min-height: 100px;
  }
  .result .from { color: var(--muted); font-size: .95rem; }
  .result .to { font-size: 1.8rem; font-weight: 700; color: var(--success); margin: 6px 0; word-break: break-word; }
  .result .rate, .result .updated { color: var(--muted); font-size: .8rem; }
  .placeholder { color: var(--muted); font-size: .9rem; padding-top: 22px; }
  .error { color: var(--error); font-size: .9rem; padding-top: 14px; }
  .loading { color: var(--muted); padding-top: 22px; }
</style>
</head>
<body>
  <main class="card">
    <h1>💱 Currency Converter</h1>
    <p class="subtitle">Live exchange rates</p>

    <div class="field">
      <label for="amount">Amount</label>
      <input type="number" id="amount" value="1" min="0" step="any" inputmode="decimal">
    </div>

    <div class="row">
      <div class="field">
        <label for="from">From</label>
        <select id="from"></select>
      </div>
      <button id="swap" type="button" title="Swap currencies" aria-label="Swap currencies">⇄</button>
      <div class="field">
        <label for="to">To</label>
        <select id="to"></select>
      </div>
    </div>

    <button id="convert" type="button">Convert</button>

    <div class="result" id="result" aria-live="polite">
      <p class="placeholder">Enter an amount and press Convert.</p>
    </div>
  </main>

<script>
  const API_URL = "https://open.er-api.com/v6/latest/";

  const amountEl = document.getElementById("amount");
  const fromEl = document.getElementById("from");
  const toEl = document.getElementById("to");
  const swapBtn = document.getElementById("swap");
  const convertBtn = document.getElementById("convert");
  const resultEl = document.getElementById("result");

  const cache = {};
  let names;
  try { names = new Intl.DisplayNames(["en"], { type: "currency" }); } catch (e) { names = null; }

  function currencyName(code) {
    try { return names ? names.of(code) : ""; } catch (e) { return ""; }
  }

  // Several free APIs are tried in order, so one being blocked or down doesn't break the app
  const SOURCES = [
    {
      url: base => API_URL + base,
      parse: d => d.result === "success"
        ? { rates: d.rates, time: d.time_last_update_unix * 1000 } : null
    },
    {
      url: base => "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/" + base.toLowerCase() + ".json",
      parse: (d, base) => {
        const raw = d[base.toLowerCase()];
        if (!raw) return null;
        const rates = {};
        Object.keys(raw).forEach(k => { rates[k.toUpperCase()] = raw[k]; });
        return { rates, time: new Date(d.date).getTime() };
      }
    },
    {
      url: base => "https://api.frankfurter.app/latest?from=" + base,
      parse: d => d.rates
        ? { rates: Object.assign({ [d.base]: 1 }, d.rates), time: new Date(d.date).getTime() } : null
    }
  ];

  async function getRates(base) {
    if (cache[base]) return cache[base];
    let lastError = null;
    for (const src of SOURCES) {
      try {
        const res = await fetch(src.url(base));
        if (!res.ok) throw new Error("Server error (" + res.status + ")");
        const parsed = src.parse(await res.json(), base);
        if (!parsed) throw new Error("Unexpected response");
        cache[base] = parsed;
        return parsed;
      } catch (e) {
        lastError = e;
      }
    }
    throw lastError || new Error("Could not fetch exchange rates.");
  }

  function fillSelects(codes) {
    const options = codes.map(c => {
      const n = currencyName(c);
      return `<option value="${c}">${c}${n && n !== c ? " - " + n : ""}</option>`;
    }).join("");
    fromEl.innerHTML = options;
    toEl.innerHTML = options;
    fromEl.value = "USD";
    toEl.value = "INR";
  }

  function show(html) { resultEl.innerHTML = html; }

  async function convert() {
    const amount = parseFloat(amountEl.value);
    if (isNaN(amount) || amount < 0) {
      show('<p class="error">Please enter a valid amount.</p>');
      return;
    }
    const from = fromEl.value, to = toEl.value;
    convertBtn.disabled = true;
    show('<p class="loading">Fetching latest rates...</p>');
    try {
      const data = await getRates(from);
      const rate = data.rates[to];
      if (rate === undefined) throw new Error("Rate not available for " + to + ".");
      const converted = amount * rate;
      const fmt = (v, max) => v.toLocaleString(undefined, { maximumFractionDigits: max });
      show(`
        <div class="from">${fmt(amount, 4)} ${from} =</div>
        <div class="to">${fmt(converted, 4)} ${to}</div>
        <div class="rate">1 ${from} = ${fmt(rate, 6)} ${to}</div>
        <div class="updated">Last updated: ${new Date(data.time).toLocaleString()}</div>
      `);
    } catch (err) {
      const msg = err instanceof TypeError ? "Network error. Check your internet connection." : err.message;
      show(`<p class="error">${msg}</p>`);
    } finally {
      convertBtn.disabled = false;
    }
  }

  function swap() {
    [fromEl.value, toEl.value] = [toEl.value, fromEl.value];
    convert();
  }

  async function init() {
    show('<p class="loading">Loading currencies...</p>');
    try {
      const data = await getRates("USD");
      fillSelects(Object.keys(data.rates).filter(c => /^[A-Z]{3}$/.test(c)).sort());
      convert();
    } catch (err) {
      fillSelects(["USD", "INR", "EUR", "GBP", "JPY", "AUD", "CAD"]);
      show('<p class="error">Could not load rates. Check your internet connection and press Convert to retry.</p>');
    }
  }

  convertBtn.addEventListener("click", convert);
  swapBtn.addEventListener("click", swap);
  fromEl.addEventListener("change", convert);
  toEl.addEventListener("change", convert);
  amountEl.addEventListener("keydown", e => { if (e.key === "Enter") convert(); });

  init();
</script>
</body>
</html>
